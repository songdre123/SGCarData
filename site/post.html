<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SG Car Data Blog post - News and analysis on Singapore car market.">
<meta name="keywords" content="Singapore car news, SG car market, COE news">
<meta name="twitter:card" content="summary">
<meta property="og:type" content="article">

<title>SG Car Data — Post</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>SG Car Data Blog</h1>
    <p class="sub">Industry news &amp; analysis</p>
  </div>
  <nav class="header-nav">
    <a class="nav-link" href="index.html">Registrations Tracker</a>
    <a class="nav-link" href="cost.html">Cost Tracker</a>
    <a class="nav-link" href="explorer.html?t=pop">Population</a>
    <a class="nav-link" href="explorer.html?t=trf">Transfers</a>
    <a class="nav-link" href="coe.html">COE</a>
    <a class="nav-link active" href="blog.html">Blog</a>
  </nav>
  <div class="header-actions"></div>
</header>

<main>
  <article class="panel">
    <div class="panel-head"><h2 id="title"></h2></div>
    <p class="table-note" id="meta"></p>
    <div id="body"></div>
    <a class="btn ghost" href="blog.html">Back to blog</a>
  </article>
</main>

<script>
  const title = document.getElementById('title');
  const meta = document.getElementById('meta');
  const body = document.getElementById('body');
  const projectId = 'pe0wkv78';
  const dataset = 'production';
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  if (!slug) { body.textContent = 'No slug specified'; }
  const query = encodeURIComponent('*[_type=="post" && slug.current=="'+slug+'"][0]{title,publishedAt,body}');
  const url = 'https://'+projectId+'.api.sanity.io/v2021-10-21/data/query/'+dataset+'?query='+query;
  async function load() {
    try {
      const res = await fetch(url);
      const data = await res.json();
      const p = data.result;
      if (!p) { body.textContent = 'Post not found'; return; }
      title.textContent = p.title || '';
      meta.textContent = p.publishedAt ? new Date(p.publishedAt).toLocaleDateString() : '';
      body.innerHTML = render(p.body||[]);
    } catch(e) { body.textContent = 'Error loading post'; }
  }
  function render(blocks) {
    return (blocks||[]).map(b=>{
      if (b._type==='block') return '<p>'+escapeHtml((b.children||[]).map(c=>c.text).join(''))+'</p>';
      return '';
    }).join('');
  }
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c])); }
  if (slug) load();
</script>
</body>
</html>
