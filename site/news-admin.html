<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Admin — SG Car Data</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <h1>News Admin</h1>
    <p class="sub">Manage industry news items</p>
  </div>
  <nav class="header-nav">
    <a class="nav-link" href="index.html">Registrations Tracker</a>
    <a class="nav-link" href="cost.html">Cost Tracker</a>
    <a class="nav-link active" href="news-admin.html">News Admin</a>
  </nav>
  <div class="header-actions">
    <a class="btn ghost" href="index.html">Back to Dashboard</a>
  </div>
</header>

<main>
  <details class="panel" open>
    <summary class="panel-head">
      <h2>News List</h2>
      <div class="filters">
        <button class="btn" id="addNewsBtn">+ Add News</button>
        <button class="btn ghost" id="saveNewsBtn">Save Changes</button>
      </div>
    </summary>
    <div class="news-admin-list" id="newsAdminList"></div>
    <p class="table-note">Data is saved to browser localStorage for this demo. For production, replace with server storage.</p>
  </details>
</main>

<script src="news-admin.js"></script>
</body>
</html>
