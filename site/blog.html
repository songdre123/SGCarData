<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SG Car Data Blog - Industry news and analysis on Singapore car market, registrations, COE and costs."
    />
    <meta
      name="keywords"
      content="Singapore car news, SG car market, COE news, LTA updates"
    />
    <meta property="og:title" content="SG Car Data Blog" />
    <meta
      property="og:description"
      content="Industry news and analysis on Singapore car market."
    />
    <meta name="twitter:card" content="summary" />
    <meta property="og:type" content="article" />

    <title>SG Car Data — Blog</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>SG Car Data Blog</h1>
        <p class="sub">Industry news &amp; analysis</p>
      </div>
      <nav class="header-nav">
        <a class="nav-link" href="index.html">Registrations Tracker</a>
        <a class="nav-link" href="cost.html">Cost Tracker</a>
    <a class="nav-link" href="explorer.html?t=pop">Population</a>
    <a class="nav-link" href="explorer.html?t=trf">Transfers</a>
        <a class="nav-link active" href="blog.html">Blog</a>
      </nav>
    </header>

    <main>
      <details class="panel" open>
        <summary class="panel-head">
          <h2>Latest Posts</h2>
        </summary>
        <div id="posts" class="news-list"></div>
      </details>
    </main>

    <script>
      const postsEl = document.getElementById("posts");
      const projectId = "pe0wkv78";
      const dataset = "production";
      const query = encodeURIComponent(
        '*[_type=="post" && defined(publishedAt)] | order(publishedAt desc){_id, title, slug, publishedAt, excerpt, "img": coverImage.asset->url}'
      );
      const url = `https://${projectId}.apicdn.sanity.io/v2021-10-21/data/query/${dataset}?query=${encodeURIComponent(query)}`;
      async function load() {
        try {
          postsEl.innerHTML = '<p class="table-note">Loading...</p>';
          const res = await fetch(url);
          const data = await res.json();
          if (!data.result || !data.result.length) {
            postsEl.innerHTML = '<p class="table-note">No posts yet.</p>';
            return;
          }
          postsEl.innerHTML = data.result
            .map(
              (p) =>
                '<article class="panel"><div class="panel-head"><h3>' +
                escapeHtml(p.title || "") +
                '</h3></div>' + (p.img ? '<img class="cover" src="' + p.img + '?w=900&h=500&fit=crop" alt="">' : '') + '<p class="table-note">' +
                (p.publishedAt
                  ? new Date(p.publishedAt).toLocaleDateString()
                  : "") +
                "</p><p>" +
                escapeHtml(p.excerpt || "") +
                "</p>" +
                (p.slug
                  ? '<a class="btn" href="post.html?slug=' +
                    encodeURIComponent(p.slug.current) +
                    '">Read more</a>'
                  : "") +
                "</article>"
            )
            .join("");
        } catch (e) {
          postsEl.innerHTML = '<p class="table-note">Error loading posts.</p>';
        }
      }
      function escapeHtml(s) {
        return (s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c]
        );
      }
      load();
    </script>
  </body>
</html>
