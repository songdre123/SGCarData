<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta
      name="description"
      content="SG Car Data Blog - Industry news and analysis on Singapore car market, registrations, COE and costs."
    />
    <meta
      name="keywords"
      content="Singapore car news, SG car market, COE news, LTA updates"
    />

    <meta property="og:title" content="SG Car Data Blog" />
    <meta
      property="og:description"
      content="Industry news and analysis on Singapore car market."
    />
    <meta property="og:type" content="article" />
    <meta name="twitter:card" content="summary" />

    <link rel="canonical" href="https://sgcardata.com/blog.html" />

    <title>SG Car Data — Blog</title>
    <link rel="stylesheet" href="styles.css" />
  
<script>
  const postsEl = document.getElementById('posts');
  const catsEl = document.getElementById('categories');
  const projectId = 'pe0wkv78';
  const dataset = 'production';
  let all = [];
  let current = 'all';

  function renderCats() {
    const cats = ['all', ...new Set(all.map(p=>p.category).filter(Boolean))];
    catsEl.innerHTML = cats.map(c=>'<li data-c="'+c+'" class="'+(current===c?'active':'')+'">'+(c==='all'?'All':c)+'</li>').join('');
    catsEl.querySelectorAll('li').forEach(li=>{
      li.addEventListener('click', ()=>{
        current = li.dataset.c;
        renderCats();
        renderPosts();
      });
    });
  }

  function renderPosts() {
    let list = all;
    if (current !== 'all') list = list.filter(p=>p.category===current);
    if (!list.length) {
      postsEl.innerHTML = '<p class="table-note">No posts.</p>';
      return;
    }
    postsEl.innerHTML = list.map(p=>'<article class="blog-card"><h3>'+escapeHtml(p.title||'')+'</h3><div class="meta">'+(p.publishedAt?new Date(p.publishedAt).toLocaleDateString():'')+(p.category?' · '+escapeHtml(p.category):'')+'</div><p>'+escapeHtml(p.excerpt||'')+'</p>'+(p.slug?'<a class="btn" href="post.html?slug='+encodeURIComponent(p.slug.current)+'">Read more</a>':'')+'</article>').join('');
  }

  async function load() {
    try {
      postsEl.innerHTML = '<p class="table-note">Loading...</p>';
      const query = encodeURIComponent('*[_type=="post" && defined(publishedAt)] | order(publishedAt desc){_id, title, slug, publishedAt, excerpt, category}');
      const url = 'https://'+projectId+'.api.sanity.io/v2021-10-21/data/query/'+dataset+'?query='+query;
      const res = await fetch(url);
      const data = await res.json();
      all = data.result || [];
      renderCats();
      renderPosts();
    } catch (e) {
      postsEl.innerHTML = '<p class="table-note">Error loading posts.</p>';
    }
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[c])); }
  load();
</script>
</head>

  <body>
    <header class="topbar">
      <div class="brand">
        <h1>SG Car Data Blog</h1>
        <p class="sub">Industry news &amp; analysis</p>
      </div>

      <nav class="header-nav">
        <a class="nav-link" href="index.html">Registrations Tracker</a>
        <a class="nav-link" href="cost.html">Cost Tracker</a>
        <a class="nav-link" href="explorer.html?t=pop">Population</a>
        <a class="nav-link" href="explorer.html?t=trf">Transfers</a>
        <a class="nav-link active" href="blog.html">Blog</a>
      </nav>
    </header>

    <main>
      <div class="blog-layout">
        <aside class="blog-sidebar">
          <h3>Categories</h3>
          <ul id="categories"></ul>
        </aside>
        <section class="blog-main">
          <details class="panel" open>
            <summary class="panel-head">
              <h2>Latest Posts</h2>
            </summary>
            <div id="posts" class="blog-grid"></div>
          </details>
        </section>
      </div>
    </main>

    <script>
      const postsEl = document.getElementById("posts");

      // Sanity project configuration
      const projectId = "pe0wkv78";
      const dataset = "production";

      // Keep the GROQ query UNENCODED here.
      // It is encoded exactly once when building the URL below.
      const query = `
        *[
          _type == "post" &&
          defined(publishedAt)
        ]
        | order(publishedAt desc) {
          _id,
          title,
          slug,
          publishedAt,
          excerpt,
          "img": coverImage.asset->url
        }
      `;

      // Encode the query ONCE.
      const url =
        `https://${projectId}.apicdn.sanity.io/v2021-10-21/data/query/${dataset}` +
        `?query=${encodeURIComponent(query)}`;

      async function load() {
        try {
          postsEl.innerHTML =
            '<p class="table-note">Loading...</p>';

          const res = await fetch(url);

          // Give a useful error if Sanity rejects the request.
          if (!res.ok) {
            const errorText = await res.text();

            console.error(
              "Sanity API error:",
              res.status,
              errorText
            );

            throw new Error(
              `Sanity API returned ${res.status}`
            );
          }

          const data = await res.json();

          console.log("Sanity response:", data);

          if (!data.result || !data.result.length) {
            postsEl.innerHTML =
              '<p class="table-note">No posts yet.</p>';
            return;
          }

          postsEl.innerHTML = data.result
            .map((p) => {
              const imageHtml = p.img
                ? `
                  <img
                    class="cover"
                    src="${escapeHtml(p.img)}?w=900&h=500&fit=crop"
                    alt=""
                  >
                `
                : "";

              const dateHtml = p.publishedAt
                ? new Date(p.publishedAt).toLocaleDateString()
                : "";

              const excerptHtml = escapeHtml(
                p.excerpt || ""
              );

              const slugHtml =
                p.slug && p.slug.current
                  ? `
                    <a
                      class="btn"
                      href="post.html?slug=${encodeURIComponent(
                        p.slug.current
                      )}"
                    >
                      Read more
                    </a>
                  `
                  : "";

              return `
                <article class="panel">
                  <div class="panel-head">
                    <h3>${escapeHtml(p.title || "")}</h3>
                  </div>

                  ${imageHtml}

                  <p class="table-note">
                    ${dateHtml}
                  </p>

                  <p>
                    ${excerptHtml}
                  </p>

                  ${slugHtml}
                </article>
              `;
            })
            .join("");
        } catch (e) {
          console.error("Error loading Sanity posts:", e);

          postsEl.innerHTML = `
            <p class="table-note">
              Error loading posts. Please check the browser console.
            </p>
          `;
        }
      }

      function escapeHtml(s) {
        return String(s || "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c]
        );
      }

      load();
    </script>
  </body>
</html>
