<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG Car Data: population and transfers</title><link rel="stylesheet" href="styles.css?v=2"></head>
<body>
<header class="topbar"><button class="hamburger" aria-label="Menu" onclick="document.body.classList.toggle('menu-open')">☰</button><div class="brand"><h1>SG Car Data Dashboard</h1><p class="sub">Singapore LTA car registrations, costs, population and transfers</p></div>
<nav class="header-nav">
    <button class="menu-close" aria-label="Close" onclick="document.body.classList.remove('menu-open')">✕</button><a class="nav-link" href="index.html">Registrations Tracker</a><a class="nav-link" href="cost.html">Cost Tracker</a><a class="nav-link" href="explorer.html?t=pop">Population</a><a class="nav-link" href="explorer.html?t=trf">Transfers</a>
    <a class="nav-link" href="coe.html">COE</a><a class="nav-link" href="blog.html">Blog</a></nav><div class="header-actions"></div></header>
<main>
<section class="panel"><div class="panel-head"><h2 id="title">Loading</h2>
 <div class="filters"><select id="view" aria-label="View"></select><select id="grp" aria-label="Group by" hidden><option value="fuel">By fuel type</option><option value="body">By body type</option></select><select id="fuel"></select><select id="split"><option value="">By make</option><option value="fuel">By make and fuel</option></select>
 <label id="monthLbl"><select id="month"></select></label><input type="search" id="search" placeholder="Search make"></div></div>
 <p class="table-note" id="note"></p>
 <div class="chart-wrap" style="height:min(60vh,520px)"><canvas id="c1"></canvas></div>
 <div class="chart-wrap" id="c2wrap" style="margin-top:16px"><canvas id="c2"></canvas></div></section>
<section class="panel"><div class="table-wrap"><table id="tbl"><thead><tr id="heads"></tr></thead><tbody></tbody></table></div></section>
</main>
<footer class="topbar"><p>Source: Singapore Land Transport Authority (LTA), Annual and Monthly Vehicle Statistics.</p></footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><script src="ui.js"></script><script src="explorer.js"></script>
<script>
// hamburger responsive fix
(function(){
  function updateHamburger() {
    var hb = document.querySelector('.hamburger');
    var nav = document.querySelector('.header-nav');
    if (!hb || !nav) return;
    if (window.innerWidth > 900) {
      hb.style.display = 'none';
      nav.style.display = 'flex';
      document.body.classList.remove('menu-open');
    } else {
      hb.style.display = 'inline-block';
      if (!document.body.classList.contains('menu-open')) {
        nav.style.display = 'none';
      }
    }
  }
  window.addEventListener('resize', updateHamburger);
  updateHamburger();
  // fix onclick
  var hb = document.querySelector('.hamburger');
  if (hb) {
    hb.onclick = function() {
      document.body.classList.toggle('menu-open');
      var nav = document.querySelector('.header-nav');
      if (nav) {
        if (document.body.classList.contains('menu-open')) {
          nav.style.display = 'flex';
        } else {
          nav.style.display = 'none';
        }
      }
    };
  }
  var mc = document.querySelector('.menu-close');
  if (mc) {
    mc.onclick = function() {
      document.body.classList.remove('menu-open');
      var nav = document.querySelector('.header-nav');
      if (nav) nav.style.display = 'none';
    };
  }
})();
</script>
<!-- hamburger-fix -->
</body></html>
